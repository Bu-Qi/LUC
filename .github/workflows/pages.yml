name: LUC power index and Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      scan_seconds:
        description: 'Scan budget in seconds (5-1200)'
        default: '480'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: luc-index-and-pages
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test indexer and frontend
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/frontend.cjs
          node --check assets/app.js
      - name: Restore persistent index
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote --heads origin refs/heads/luc-data)
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags origin luc-data
            git worktree add --detach .luc-data FETCH_HEAD
            git -C .luc-data switch -c luc-data
          else
            git worktree add --detach .luc-data HEAD
            git -C .luc-data switch --orphan luc-data
          fi
      - name: Find contract deployment block
        env:
          QKI_RPC_URLS: ${{ secrets.QKI_RPC_URLS || vars.QKI_RPC_URLS }}
          LUC_START_BLOCK: ${{ vars.LUC_START_BLOCK || '0' }}
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.request
          from pathlib import Path
          contract = '0x5c8426a122bf473a068e6d9dd5d2d624cbf958f9'
          urls = [x for x in re.split(r'[\\s,;]+', os.getenv('QKI_RPC_URLS','').strip()) if x]
          if not urls:
              urls = [f'https://rpc{i}.{d}' for d in ('qkirpc.org','qkiscan.io') for i in (1,2,3)]
          def rpc(url, method, params):
              req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'Content-Type':'application/json','User-Agent':'LUC-Power-Indexer'})
              with urllib.request.urlopen(req,timeout=10) as r: obj=json.load(r)
              if 'error' in obj or 'result' not in obj: raise RuntimeError('RPC error')
              return obj['result']
          deployment = None
          for url in urls:
              try:
                  if int(rpc(url,'eth_chainId',[]),16)!=20181205: continue
                  head=int(rpc(url,'eth_blockNumber',[]),16)
                  if rpc(url,'eth_getCode',[contract,'0x0']) not in ('0x','0x0'): 
                      deployment=0
                  else:
                      lo,hi=0,head
                      if rpc(url,'eth_getCode',[contract,hex(hi)]) in ('0x','0x0'): raise RuntimeError('Contract bytecode unavailable at head')
                      while lo+1<hi:
                          mid=(lo+hi)//2
                          code=rpc(url,'eth_getCode',[contract,hex(mid)])
                          if code in ('0x','0x0'): lo=mid
                          else: hi=mid
                      deployment=hi
                  print(f'Contract deployment block: {deployment} (RPC host only: {url.split("/")[2]})')
                  break
              except Exception as e:
                  print(f'RPC candidate failed: {type(e).__name__}')
          if deployment is None:
              override=int(os.getenv('LUC_START_BLOCK','0'))
              print(f'Could not auto-detect deployment block; using configured start block {override}')
              deployment=override
          state_path=Path('.luc-data/state.json')
          if state_path.exists():
              s=json.loads(state_path.read_text())
              # First run previously scanned only genesis blocks before auto-detection was added.
              if s.get('start_block')==0 and s.get('next_block',0)<=1000000 and not s.get('addresses') and deployment>0:
                  s.update(start_block=deployment,next_block=deployment,next_log_block=deployment,next_trace_block=deployment,last_block_hash=None)
                  tmp=state_path.with_suffix('.tmp');tmp.write_text(json.dumps(s,separators=(',',':')));tmp.replace(state_path)
                  print('Moved empty genesis checkpoint to deployment block.')
              else:
                  deployment=s.get('start_block',deployment)
                  print('Resuming existing saved checkpoint; start block remains '+str(deployment))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LUC_START_BLOCK='+str(deployment)+'\\n')
          PY
      - name: Scan blocks and read LUC power
        id: scan
        continue-on-error: true
        env:
          QKI_RPC_URLS: ${{ secrets.QKI_RPC_URLS || vars.QKI_RPC_URLS }}
          LUC_START_BLOCK: ${{ vars.LUC_START_BLOCK || '0' }}
          LUC_TRACE: ${{ vars.LUC_TRACE || '0' }}
          SCAN_SECONDS: ${{ inputs.scan_seconds || (github.event_name == 'push' && '60' || '480') }}
        run: python scripts/index_power.py --state-dir .luc-data --seconds "$SCAN_SECONDS"
      - name: Save checkpoint and snapshot
        if: always() && steps.restore.outcome == 'success'
        run: |
          set -eu
          git -C .luc-data config user.name 'github-actions[bot]'
          git -C .luc-data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .luc-data/state.json ]; then git -C .luc-data add state.json; fi
          if [ -d .luc-data/public ]; then git -C .luc-data add public; fi
          if ! git -C .luc-data diff --cached --quiet; then
            git -C .luc-data commit -m 'Update LUC scan checkpoint and power snapshot'
            git -C .luc-data push origin HEAD:refs/heads/luc-data
          fi
      - name: Build static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/index.html
          cp assets/app.js assets/style.css _site/assets/
          touch _site/.nojekyll
          if [ -d .luc-data/public ]; then cp -a .luc-data/public/. _site/data/; fi
      - name: Publish run summary
        if: always() && steps.restore.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('.luc-data/public/status.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## LUC indexer\n\n')
              if p.exists():
                  s = json.loads(p.read_text())
                  f.write('```json\n' + json.dumps(s, indent=2) + '\n```\n')
              f.write('\nThe leaderboard is partial until power totals reconcile.\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (must be enabled in repository settings)
        uses: actions/configure-pages@v5
      - name: Deploy static dashboard
        id: deployment
        uses: actions/deploy-pages@v4
